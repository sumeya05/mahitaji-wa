# /etc/nginx/sites-available/mahitaji   (then: ln -s into sites-enabled, nginx -t, systemctl reload nginx)
# TLS lines are added by: certbot --nginx -d mahitaji.co.ke -d www.mahitaji.co.ke

# Rate-limit zones: keyed by client address, counted per second.
limit_req_zone  $binary_remote_addr zone=auth:10m   rate=10r/m;    # sign-in, register, password reset
limit_req_zone  $binary_remote_addr zone=pay:10m    rate=20r/m;    # M-Pesa prompts and status polling
limit_req_zone  $binary_remote_addr zone=api:10m    rate=60r/m;    # JSON API and the assistant
limit_req_zone  $binary_remote_addr zone=site:10m   rate=30r/s;    # everything else
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;

upstream mahitaji_app {
    server unix:/run/mahitaji/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name mahitaji.co.ke www.mahitaji.co.ke;
    # certbot inserts the redirect to HTTPS here
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mahitaji.co.ke www.mahitaji.co.ke;
    # ssl_certificate / ssl_certificate_key lines are written by certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /srv/mahitaji/app;
    client_max_body_size 200m;         # bulk product-photo uploads (zips) in the admin
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    server_tokens off;
    limit_conn perip 40;

    # Security headers (Django adds HSTS, nosniff, referrer-policy and X-Frame-Options itself).
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/csv application/json application/javascript image/svg+xml;

    # Hashed static files: cache for a year. Media (product photos): a week.
    location /static/ {
        alias /srv/mahitaji/app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location /media/ {
        alias /srv/mahitaji/app/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        # Never execute anything that was uploaded.
        location ~* \.(php|py|pl|sh|cgi|html?)$ { return 404; }
    }
    location = /robots.txt { try_files /staticfiles/robots.txt @app; }

    # Noisy scanners: no point handing them to Django.
    location ~* ^/(wp-admin|wp-login\.php|xmlrpc\.php|\.env|\.git|phpmyadmin|cgi-bin) { return 444; }
    location ~ /\. { return 404; }

    location ~ ^/(login|register|password-reset|reset)/ {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/snippets/mahitaji-proxy.conf;
    }
    location ~ ^/(mpesa/pay|mpesa/callback|check-payment-status|orders/[^/]+/(pay-on-delivery|cancel))/ {
        limit_req zone=pay burst=20 nodelay;
        include /etc/nginx/snippets/mahitaji-proxy.conf;
    }
    location ~ ^/(data|ai-assistant-chat)/ {
        limit_req zone=api burst=30 nodelay;
        include /etc/nginx/snippets/mahitaji-proxy.conf;
    }
    location / {
        limit_req zone=site burst=60 nodelay;
        include /etc/nginx/snippets/mahitaji-proxy.conf;
    }
    location @app {
        include /etc/nginx/snippets/mahitaji-proxy.conf;
    }
}
