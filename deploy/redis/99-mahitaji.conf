# /etc/redis/redis.conf additions (or drop in as the last include). Redis holds the rate-limit
# counters, the navigation cache and a read-through copy of sessions; it is a cache, not a store.
bind 127.0.0.1 ::1
protected-mode yes
port 6379
maxmemory 128mb
maxmemory-policy allkeys-lru
save ""
appendonly no
