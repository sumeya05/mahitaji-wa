<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahitaji Fleet preview</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 16px; padding: 24px 16px;
         box-sizing: border-box; background: #e8f1f8; font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #3b5876; }
  .phone { width: 390px; height: 844px; padding: 12px; border-radius: 54px; background: #0a1931;
           box-shadow: 0 30px 60px -24px rgba(10,25,49,.5); position: relative; }
  .screen { height: 100%; border-radius: 42px; overflow: hidden; background: #fff; display: flex; flex-direction: column; }
  .status { flex: none; height: 46px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 30px; font-weight: 600; font-size: 14px; color: #0a1931; background: #fff; }
  .status i { width: 108px; height: 30px; border-radius: 16px; background: #0a1931; }
  .home { flex: none; height: 26px; background: #fff; display: grid; place-items: center; }
  .home i { width: 130px; height: 5px; border-radius: 3px; background: #0a1931; }
  iframe { flex: 1; width: 100%; border: 0; background: #f6fafd; display: block; }
  .bar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center; }
  a, button { color: #1a3d63; font-weight: 600; background: none; border: 0; cursor: pointer; font: inherit; font-weight: 600; text-decoration: underline; }
  @media (max-height: 920px) { .phone { transform: scale(.85); transform-origin: top center; margin-bottom: -127px; } }
</style>
</head>
<body>
  <div class="phone"><div class="screen">
    <div class="status"><span>9:41</span><i></i><span>5G ▮</span></div>
    <iframe id="app" src="/" title="Mahitaji Fleet"></iframe>
    <div class="home"><i></i></div>
  </div></div>
  <div class="bar">
    <button type="button" onclick="document.getElementById('app').src='/'">Restart app</button>
  </div>
</body>
</html>
