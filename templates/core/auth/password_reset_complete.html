{% extends 'base/base.html' %}

{% block title %}Password updated · {{ site.name }}{% endblock %}

{% block content %}
<section class="auth">
  <div class="auth-card text-center">
    <div class="auth-icon"><i class="fa-solid fa-circle-check"></i></div>
    <h1 class="auth-title">Password updated</h1>
    <p class="auth-lead">Your new password has been saved. Sign in to get back to your orders and account.</p>
    <a href="{% url 'login' %}" class="btn btn-primary btn-lg btn-block">Sign in</a>
  </div>
</section>
{% endblock %}
