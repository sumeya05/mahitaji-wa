{% extends 'base/base.html' %}

{% block title %}Password updated · {{ site.name }}{% endblock %}
{% block body_class %}is-auth{% endblock %}

{% block content %}
<section class="section">
  <div class="container">
    <div class="auth-card card" style="margin:0 auto">
      <div class="card-body text-center">
        <div class="empty-icon" style="background:var(--brand-100);color:var(--brand-600)"><i class="fa-solid fa-circle-check"></i></div>
        <h1 style="font-size:1.6rem">Password updated</h1>
        <p class="muted">Your new password is saved. Sign in to get back to your orders and account.</p>
        <a href="{% url 'login' %}" class="btn btn-primary mt-3"><i class="fa-solid fa-right-to-bracket"></i> Sign in</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
