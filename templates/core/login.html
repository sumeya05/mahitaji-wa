{% extends "base/base.html" %}
{% load static %}

{% block title %}Login | Mahitaji{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <a href="{% url 'home' %}"><img src="{% static 'assets/logo.png' %}" alt="Logo"></a>
            <h2>Welcome Back</h2>
        </div>

        <div id="loginError"></div>

        <form id="loginForm">
            
            {% csrf_token %}
            <div class="form-group">
                <label>Username / Email</label>
                <input type="text" name="username" placeholder="Enter your username" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" id="id_password" placeholder="••••••••" required>
                <i class="fa-solid fa-eye toggle-password" id="toggleIcon" onclick="togglePass('id_password', this)"></i>
                <a href="{% url 'password_reset' %}" class="forgot-link">Forgot Password?</a>
            </div>
            
            <button type="submit" class="auth-btn" id="submitBtn">Login to Account</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{% url 'signup' %}">Register Account</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>

document.addEventListener('DOMContentLoaded', function() {
    const loginForm = document.getElementById('loginForm');

    if (loginForm) {
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('loginError');
            const formData = new FormData(this);
            
            btn.disabled = true;
            btn.innerText = "Authenticating...";
            errorBox.style.display = 'none';

            try {
                const response = await fetch("{% url 'login' %}", {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                        'X-CSRFToken': formData.get('csrfmiddlewaretoken')
                    }
                });

                const data = await response.json();

                if (data.success) {
                    window.location.href = data.redirect_url;
                } else {
                    errorBox.innerText = data.error || "Login failed. Please check your credentials.";
                    errorBox.style.display = 'block';
                    btn.disabled = false;
                    btn.innerText = "Login to Account";
                }
            } catch (error) {
                errorBox.innerText = "Connection error. Please try again later.";
                errorBox.style.display = 'block';
                btn.disabled = false;
                btn.innerText = "Login to Account";
            }
        });
    }
});
</script>
{% endblock %}
