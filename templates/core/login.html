{% extends "base/base.html" %}
{% load static %}

{% block title %}Login | Mahitaji{% endblock %}

{% block extra_css %}
<style>
.auth-wrapper {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
}
.auth-card {
    background: white;
    border: 1px solid var(--border-color);
    border-radius: 12px;
    width: 100%;
    max-width: 450px;
    padding: 2.5rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
}
.auth-header { text-align: center; margin-bottom: 2rem; }
.auth-header img { height: 50px; margin-bottom: 10px; }
.auth-header h2 { color: var(--dark-navy); }

.form-group { margin-bottom: 1.2rem; }
label { display: block; margin-bottom: 8px; font-size: 0.9rem; font-weight: 600; color: #475569; }
input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; outline: none; box-sizing: border-box; }
input:focus { border-color: var(--primary-blue); }

/* Error Message Styling */
#loginError {
    display: none;
    background: #fee2e2;
    color: #dc2626;
    padding: 0.75rem;
    border-radius: 8px;
    margin-bottom: 1.5rem;
    font-size: 0.85rem;
    border: 1px solid #fecaca;
}

.auth-btn { width: 100%; padding: 12px; background: var(--primary-blue); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 1rem; transition: 0.3s; }
.auth-btn:hover { background: var(--dark-navy); }
.auth-btn:disabled { background: #cbd5e1; cursor: not-allowed; }

.auth-footer { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #64748b; }
.auth-footer a { color: var(--primary-blue); text-decoration: none; font-weight: 600; }
.forgot-link { display: block; text-align: right; font-size: 0.8rem; margin-top: 5px; color: var(--primary-blue); text-decoration: none; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <a href="{% url 'home' %}"><img src="{% static 'assets/logo.png' %}" alt="Logo"></a>
            <h2>Welcome Back</h2>
        </div>

        <div id="loginError"></div>

        <form id="loginForm">
            {% csrf_token %}
            <div class="form-group">
                <label>Username / Email</label>
                <input type="text" name="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>
            <button type="submit" class="auth-btn" id="submitBtn">Login to Account</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{% url 'signup' %}">Register Business</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const form = e.target;
    const btn = document.getElementById('submitBtn');
    const errorBox = document.getElementById('loginError');
    const formData = new FormData(form);
    
    // UI State: Loading
    btn.disabled = true;
    btn.innerText = "Authenticating...";
    errorBox.style.display = 'none';

    try {
        const response = await fetch("{% url 'login' %}", {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
                'X-CSRFToken': formData.get('csrfmiddlewaretoken')
            }
        });

        const data = await response.json();

        if (data.success) {
            // Success! Redirect to dashboard
            window.location.href = data.redirect_url;
        } else {
            // Show Error
            errorBox.innerText = data.error || "Login failed. Please check your credentials.";
            errorBox.style.display = 'block';
            btn.disabled = false;
            btn.innerText = "Login to Account";
        }
    } catch (error) {
        errorBox.innerText = "Connection error. Please try again later.";
        errorBox.style.display = 'block';
        btn.disabled = false;
        btn.innerText = "Login to Account";
    }
});
</script>
{% endblock %}
