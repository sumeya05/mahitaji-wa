<ul class="minicart-product-list" id="minicart-list">
    {% for item in cart %}
    {% with product=item.product %}
    <li>
        <a href="{% url 'product_detail' product.pk %}" class="minicart-product-image">
            <img src="{{ product.image_url }}" alt="{{ product.name }}">
        </a>
        <div class="minicart-product-details">
            <h6><a href="{% url 'product_detail' product.pk %}">{{ product.name }}</a></h6>
            <span>ksh {{ item.price }} x {{ item.qty }}</span>
        </div>
        <button class="close delete-product" data-index="{{ product.id }}" title="Remove">
            <i class="fa fa-close"></i>
        </button>
    </li>
    {% endwith %}
    {% empty %}
    <li>Your cart is empty</li>
    {% endfor %}
</ul>

<p class="minicart-total">SUBTOTAL: <span id="cart-total">ksh {{ cart.get_total_price }}</span></p>

<div class="minicart-button">
    <a href="{% url 'shopping-cart' %}" class="li-button li-button-fullwidth li-button-dark">
        <span>View Full Cart</span>
    </a>
    <a href="{% url 'checkout' %}" class="li-button li-button-fullwidth">
        <span>Checkout</span>
    </a>
</div>
