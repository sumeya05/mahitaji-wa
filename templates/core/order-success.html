{% extends "base/base.html" %}
{% load static %}

{% block content %}
<div class="error404-area pt-30 pb-60">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="error-wrapper text-center ptb-50 border-radius-5">
                    <div class="error-text">
                        <h1 style="color: #49b04d;">Thank You!</h1>
                        <h2>Your order has been placed successfully.</h2>
                        <p>Order Number: <strong>#{{ order.order_number }}</strong></p>
                        <p>We've sent a confirmation email to {{ request.user.email }}.</p>
                    </div>
                    <div class="error-button">
                        <a href="{% url 'home' %}" style="background-color: #49b04d; border-radius: 5px;">Continue Shopping</a>
                        <a href="{% url 'dashboard' %}" class="ml-10" style="background-color: #333; border-radius: 5px;">View My Orders</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
