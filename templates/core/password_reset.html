{% extends "base/base.html" %}
{% load static %}

{% block title %}Reset Password | Mahitaji{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <a href="{% url 'home' %}"><img src="{% static 'assets/logo.png' %}" alt="Logo"></a>
            <h2>Reset Password</h2>
            <p>Enter your email to receive a recovery link.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="name@business.com" required>
            </div>
            <button type="submit" class="auth-btn">Send Recovery Link</button>
        </form>

        <div class="auth-footer">
            <a href="{% url 'login' %}">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const authForm = document.querySelector('form'); // Targets the reset form
        if (authForm) {
            authForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const btn = this.querySelector('.auth-btn');
                const formData = new FormData(this);
                
                btn.disabled = true;
                btn.innerText = "Processing...";

                try {
                    const response = await fetch(window.location.href, {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest',
                            'X-CSRFToken': formData.get('csrfmiddlewaretoken')
                        }
                    });

                    const data = await response.json();
                    if (data.success) {
                        window.location.href = data.redirect_url;
                    } else {
                        // Logic to show errors in your #errorBox
                        alert(data.error || "Please check your input."); 
                        btn.disabled = false;
                        btn.innerText = "Try Again";
                    }
                } catch (error) {
                    btn.disabled = false;
                    btn.innerText = "Error - Retry";
                }
            });
        }
    });
</script>
{% endblock %}
