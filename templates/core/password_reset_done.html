{% extends "base/base.html" %}
{% load static %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-icon-circle">
            <i class="fa-solid fa-paper-plane"></i>
        </div>
        <div class="auth-header">
            <h2>Check Your Email</h2>
            <p>If an account exists with that email, we've sent instructions to reset your password.</p>
        </div>
        <a href="{% url 'login' %}" class="auth-btn">Return to Login</a>
    </div>
</div>
{% endblock %}

{% block extra_js %}

<script>



    document.addEventListener('DOMContentLoaded', function() {
        const authForm = document.querySelector('form'); // Targets the reset form
        if (authForm) {
            authForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const btn = this.querySelector('.auth-btn');
                const formData = new FormData(this);
                
                btn.disabled = true;
                btn.innerText = "Processing...";

                try {
                    const response = await fetch(window.location.href, {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest',
                            'X-CSRFToken': formData.get('csrfmiddlewaretoken')
                        }
                    });

                    const data = await response.json();
                    if (data.success) {
                        window.location.href = data.redirect_url;
                    } else {
                        // Logic to show errors in your #errorBox
                        alert(data.error || "Please check your input."); 
                        btn.disabled = false;
                        btn.innerText = "Try Again";
                    }
                } catch (error) {
                    btn.disabled = false;
                    btn.innerText = "Error - Retry";
                }
            });
        }
    });

    </script>
    
{% endblock %}
