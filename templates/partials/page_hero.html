{% comment %}Usage: {% include 'partials/page_hero.html' with title="..." subtitle="..." crumb="..." compact=True %}{% endcomment %}
<section class="page-hero{% if compact %} compact{% endif %}">
  <div class="container">
    <ul class="breadcrumb">
      <li><a href="{% url 'home' %}">Home</a></li>
      {% if parent_url %}<li><a href="{{ parent_url }}">{{ parent_label }}</a></li>{% endif %}
      <li class="current">{{ crumb|default:title }}</li>
    </ul>
    <h1>{{ title }}</h1>
    {% if subtitle %}<p>{{ subtitle }}</p>{% endif %}
  </div>
</section>
